name: Android build
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APKs, run JVM tests and lint
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Compile store variants and verify that checkout stays disabled
        run: bash ./gradlew -Pforge.storeBuild=true :app:assemblePlayDebug :app:assembleRustoreDebug :app:testPlayDebugUnitTest :app:testRustoreDebugUnitTest --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: forge-training-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: forge-android-instrumentation-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-training-check-reports
          path: app/build/reports/
          if-no-files-found: ignore
