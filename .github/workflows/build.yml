
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Find and unpack project
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          mkdir -p source
          unzip -o "$ZIP" -d source

      - name: Locate Android project
        run: |
          find source -type f \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \)

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          GRADLE_FILE=$(find source -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Android Gradle project not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          while [ "$PROJECT_DIR" != "source" ] && [ "$PROJECT_DIR" != "." ]; do
            if [ -f "$PROJECT_DIR/settings.gradle" ] || [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
              break
            fi
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: training-calculator-apk
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
