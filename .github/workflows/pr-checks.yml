name: FORGE web and data checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:catalog-picker
      - run: npm run test:training-import
      - run: npm run test:device-settings
      - run: npm run test:barcode
      - run: npm run test:cloud-snapshot
      - run: node scripts/check-art-coverage.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-browser-evidence
          path: |
            test-results/
            docs/design-screenshots/*.png
            docs/art-reference-screenshots/*.png
            docs/art-contact-sheets/*.png
          if-no-files-found: ignore
