name: FORGE web and data checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Compare rendered UX screenshots with reviewed references
        id: visuals
        continue-on-error: true
        run: node scripts/ux-v2-visual.cjs
      - uses: actions/upload-artifact@v4
        if: steps.visuals.outcome == 'failure'
        with:
          name: forge-visual-comparison
          path: test-results/ux-v2/visual/
          if-no-files-found: ignore
      - run: npm test
        env:
          FORGE_CYCLE_SCREENSHOTS: test-results/cycles
          FORGE_SCREENSHOT_DIR: test-results/design
      - run: node --test scripts/training-cycles.test.cjs
      - run: node --test scripts/product-10x.test.cjs
      - run: node scripts/product-10x-browser.cjs
      - run: npm run test:catalog-picker
      - run: npm run test:training-import
      - run: npm run test:device-settings
      - run: npm run test:barcode
      - run: npm run test:cloud-snapshot
      - run: npm run test:commerce-sandbox
      - run: node scripts/check-art-coverage.cjs
      - run: node --test scripts/delete-account.test.mjs
      - run: node scripts/release-data-browser.cjs
      - run: node scripts/account-deletion-browser.cjs
      - run: node scripts/release-performance.cjs
      - run: node scripts/ux-v2-geometry.cjs
      - run: node scripts/ux-v2-products-browser.cjs
      - run: npm audit --audit-level=high
      - name: Require matching reviewed screenshots
        if: always() && steps.visuals.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-browser-evidence
          path: |
            test-results/
            docs/design-screenshots/*.png
            docs/art-reference-screenshots/*.png
            docs/art-contact-sheets/*.png
            docs/ux-v2/reference/
          if-no-files-found: ignore
