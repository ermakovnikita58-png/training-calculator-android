name: Android upgrade and device tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/apk-upgrade.yml'
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build known 11.2.5 and candidate APKs with the same runner key
        shell: bash
        run: |
          git fetch origin 234520966cfe51176e924979cd91480fac0eaba4
          git worktree add --detach "$RUNNER_TEMP/forge-previous" FETCH_HEAD
          (cd "$RUNNER_TEMP/forge-previous" && bash ./gradlew :app:assembleDebug --no-daemon)
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/android-upgrade-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-emulator-evidence
          path: test-results/
          if-no-files-found: ignore
