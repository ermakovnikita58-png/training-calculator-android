name: Android upgrade and device tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/apk-upgrade.yml'
      - 'scripts/android-upgrade-test.sh'
permissions:
  contents: read
env:
  FORGE_GOOGLE_WEB_CLIENT_ID: ${{ vars.FORGE_GOOGLE_WEB_CLIENT_ID }}
jobs:
  upgrade:
    name: Android upgrade from ${{ matrix.version }} (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '10.1.0'
            version_code: '12'
            commit: ce7d407d251ce5891b8f29bb15423f6afe2cde5f
            api: 33
          - version: '11.2.5'
            version_code: '23'
            commit: 234520966cfe51176e924979cd91480fac0eaba4
            api: 34
          - version: '11.3.0'
            version_code: '24'
            commit: 3f330432fe5d7bcdaeabbcc038e0aabceb2a49ed
            api: 35
          - version: '11.4.1'
            version_code: '26'
            commit: e776f466fc86b04cf9d03db726f2ddecde28376a
            api: 36
          - version: '11.4.2'
            version_code: '27'
            commit: 28930a461fd2ffeb95c5fbe480c3be855e02c8f6
            api: 36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build baseline and candidate APKs with the same runner key
        shell: bash
        env:
          BASE_SHA: ${{ matrix.commit }}
        run: |
          git fetch origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/forge-previous" FETCH_HEAD
          (cd "$RUNNER_TEMP/forge-previous" && bash ./gradlew :app:assembleDebug --no-daemon)
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          mkdir -p test-results
          git -C "$RUNNER_TEMP/forge-previous" rev-parse HEAD > test-results/baseline-commit.txt
          git rev-parse HEAD > test-results/candidate-commit.txt
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare emulator SDK with download retries
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpulse0
          for delay in 0 5 15; do
            sleep "$delay"
            if sdkmanager "emulator" "system-images;android-${{ matrix.api }};google_apis;x86_64" && "$ANDROID_HOME/emulator/emulator" -version; then exit 0; fi
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          BASE_VERSION_CODE: ${{ matrix.version_code }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          pre-emulator-launch-script: |
            sed -i '/^hw\.mainKeys[[:space:]]*=/d' "$ANDROID_AVD_HOME/test.avd/config.ini"
            printf '\nhw.mainKeys=no\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: bash scripts/android-upgrade-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-emulator-evidence-from-${{ matrix.version }}
          path: test-results/
          if-no-files-found: ignore
