name: FORGE cycle WebView upgrade
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'scripts/android-cycle-upgrade.sh'
      - '.github/workflows/cycle-upgrade.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both APKs with the same runner key
        shell: bash
        run: |
          git fetch origin 6729fa5a20c88fdd5ca25b990ee337b8ec0f82be
          git worktree add --detach "$RUNNER_TEMP/forge-base-10" FETCH_HEAD
          (cd "$RUNNER_TEMP/forge-base-10" && bash ./gradlew :app:assembleDebug --no-daemon)
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare emulator SDK with download retries
        shell: bash
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libpulse0
          for delay in 0 5 15; do
            sleep "$delay"
            if sdkmanager "emulator" "system-images;android-35;google_apis;x86_64" && "$ANDROID_HOME/emulator/emulator" -version; then exit 0; fi
          done
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          pre-emulator-launch-script: |
            sed -i '/^hw\.mainKeys[[:space:]]*=/d' "$ANDROID_AVD_HOME/test.avd/config.ini"
            printf '\nhw.mainKeys=no\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"
          script: bash scripts/android-cycle-upgrade.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cycle-webview-evidence
          path: test-results/
          if-no-files-found: ignore
