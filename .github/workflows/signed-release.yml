name: Signed Android build
on:
  workflow_dispatch:
    inputs:
      confirm_signing:
        description: Authorize signed build artifacts
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  sign:
    if: inputs.confirm_signing && github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK and AAB
        shell: bash
        env:
          FORGE_KEYSTORE_BASE64: ${{ secrets.FORGE_KEYSTORE_BASE64 }}
          FORGE_KEYSTORE_PASSWORD: ${{ secrets.FORGE_KEYSTORE_PASSWORD }}
          FORGE_KEY_ALIAS: ${{ secrets.FORGE_KEY_ALIAS }}
          FORGE_KEY_PASSWORD: ${{ secrets.FORGE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FORGE_KEYSTORE_BASE64:?Configure FORGE_KEYSTORE_BASE64}"
          : "${FORGE_KEYSTORE_PASSWORD:?Configure FORGE_KEYSTORE_PASSWORD}"
          : "${FORGE_KEY_ALIAS:?Configure FORGE_KEY_ALIAS}"
          : "${FORGE_KEY_PASSWORD:?Configure FORGE_KEY_PASSWORD}"
          export FORGE_KEYSTORE_FILE="$RUNNER_TEMP/forge-upload.jks"
          trap 'rm -f "$FORGE_KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$FORGE_KEYSTORE_BASE64" | base64 --decode > "$FORGE_KEYSTORE_FILE"
          bash ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: forge-training-signed-artifacts
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
