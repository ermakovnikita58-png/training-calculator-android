name: Signed Android build
on:
  workflow_dispatch:
    inputs:
      confirm_signing:
        description: Authorize signed build artifacts
        type: boolean
        default: false
permissions:
  contents: read
env:
  FORGE_GOOGLE_WEB_CLIENT_ID: ${{ vars.FORGE_GOOGLE_WEB_CLIENT_ID }}
jobs:
  sign:
    if: inputs.confirm_signing && github.ref == 'refs/heads/main'
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify store-signed files
        shell: bash
        env:
          FORGE_KEYSTORE_BASE64: ${{ secrets.FORGE_KEYSTORE_BASE64 }}
          FORGE_KEYSTORE_PASSWORD: ${{ secrets.FORGE_KEYSTORE_PASSWORD }}
          FORGE_KEY_ALIAS: ${{ secrets.FORGE_KEY_ALIAS }}
          FORGE_KEY_PASSWORD: ${{ secrets.FORGE_KEY_PASSWORD }}
          FORGE_RELEASE_CERT_SHA256: ${{ vars.FORGE_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          : "${FORGE_KEYSTORE_BASE64:?Configure FORGE_KEYSTORE_BASE64}"
          : "${FORGE_KEYSTORE_PASSWORD:?Configure FORGE_KEYSTORE_PASSWORD}"
          : "${FORGE_KEY_ALIAS:?Configure FORGE_KEY_ALIAS}"
          : "${FORGE_KEY_PASSWORD:?Configure FORGE_KEY_PASSWORD}"
          : "${FORGE_RELEASE_CERT_SHA256:?Configure expected public certificate SHA-256}"
          expected="$(printf '%s' "$FORGE_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          export FORGE_KEYSTORE_FILE="$RUNNER_TEMP/forge-upload.jks"
          trap 'rm -f "$FORGE_KEYSTORE_FILE"' EXIT
          umask 077
          printf '%s' "$FORGE_KEYSTORE_BASE64" | base64 --decode > "$FORGE_KEYSTORE_FILE"
          bash ./gradlew -Pforge.storeBuild=true :app:bundlePlayRelease :app:assembleRustoreRelease --no-daemon --stacktrace
          apk=app/build/outputs/apk/rustore/release/app-rustore-release.apk
          aab=app/build/outputs/bundle/playRelease/app-play-release.aab
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p signed-provenance
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > signed-provenance/apk-cert.txt
          "$tools/aapt" dump badging "$apk" > signed-provenance/package.txt
          grep -ix "Signer #1 certificate SHA-256 digest: $expected" signed-provenance/apk-cert.txt
          jarsigner -verify "$aab" > signed-provenance/bundle-signature.txt
          grep -Fx 'jar verified.' signed-provenance/bundle-signature.txt
          keytool -printcert -jarfile "$aab" > signed-provenance/bundle-cert.txt
          bundle_cert="$(awk '/SHA256:/{print $2;exit}' signed-provenance/bundle-cert.txt | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          [[ "$bundle_cert" == "$expected" ]]
          python3 scripts/android-release-check.py "$apk" "$aab" > signed-provenance/elf.txt
          git rev-parse HEAD > signed-provenance/commit.txt
          sha256sum "$apk" "$aab" > signed-provenance/SHA256SUMS
      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: forge-training-signed-artifacts
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/apk/rustore/release/*.apk
            signed-provenance/
          if-no-files-found: error
